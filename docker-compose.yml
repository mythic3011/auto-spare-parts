# Local development stack. Run ./scripts/init.sh before first startup.
name: auto-spare-parts

services:
  nginx:
    image: nginx:1.21.6
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8880}:80"
    volumes:
      - ./resources/docker/nginx:/etc/nginx:ro
      - ./:/var/www/html:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost/]
      interval: 5s
      timeout: 3s
      retries: 20

  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html
      # Keep image-installed dependencies visible beneath the source bind mount.
      - php_vendor:/var/www/html/vendor
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      DOCKER_ENV: 'true'
      DB_DRIVER: mysqli
      DB_PORT: '3306'
      DB_DOCKER_HOST: mariadb
      DB_DOCKER_USER: root
      DB_DOCKER_PASSWORD: ${DB_DOCKER_PASSWORD:?Set DB_DOCKER_PASSWORD in .env}
      DB_DOCKER_NAME: projectDB
      SHIPPING_SERVICE_URL: http://api:8080
    depends_on:
      mariadb:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, -r, "exit(is_resource(@fsockopen('127.0.0.1', 9000)) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 20

  mariadb:
    image: mariadb:10.5
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_DOCKER_PASSWORD:?Set DB_DOCKER_PASSWORD in .env}
      # The canonical legacy SQL seed owns this database name.
      MYSQL_DATABASE: projectDB
    volumes:
      - ./sql-scripts/setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=tcp -h 127.0.0.1 -u root projectDB -e "SELECT 1 FROM Item LIMIT 1" >/dev/null']
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:5.2.2
    profiles: [tools]
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${PHPMYADMIN_PORT:-8090}:80"
    environment:
      PMA_HOST: mariadb
    depends_on:
      mariadb:
        condition: service_healthy

  api:
    build:
      context: ./resources/py
      dockerfile: Dockerfile
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mariadb_data:
  php_vendor:
